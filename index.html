<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记录系统</title>
    <style>
        *{box-sizing:border-box;font-family:Arial;margin:0;padding:0;}
        .container{max-width:500px;margin:30px auto;padding:0 15px;}
        .card{background:#f5f5f5;padding:15px;border-radius:10px;margin-bottom:15px;}
        input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:6px;}
        button{padding:10px 14px;margin:5px 2px;border:none;border-radius:6px;background:#007bff;color:white;cursor:pointer;}
        .btn-red{background:#dc3545;}
        .hide{display:none;}
        .item{padding:10px;border-bottom:1px solid #ddd;}
        .item h4{margin-bottom:5px;}
        .item p{color:#555;font-size:14px;}
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="loginPage">
        <h3>登录</h3>
        <input type="text" id="uid" placeholder="账号">
        <input type="password" id="pwd" placeholder="密码">
        <button onclick="login()">登录</button>
    </div>
    <div class="card hide" id="mainPage">
        <button class="btn-red" onclick="logout()">退出登录</button>
        <br><br>
        <h3>新增记录</h3>
        <input type="text" id="title" placeholder="标题">
        <input type="text" id="content" placeholder="内容">
        <button onclick="saveData()">保存</button>
        <br><br>
        <h3>查询</h3>
        <input type="text" id="kw" placeholder="搜索标题">
        <button onclick="search()">搜索</button>
        <button onclick="getAll()">查询全部</button>
        <!-- =========量子随机数生成模块【前端本地随机，不用后端】========= -->
        <div style="border:1px solid #777; padding:18px; margin:20px 0; border-radius:8px;">
            <h3>量子随机数生成器</h3>
            <div style="margin-top:10px;">
                <button id="calcBtn">自动生成7个号码</button>
                <div id="showResult" style="margin:12px 0; font-size:18px; letter-spacing:2px;"></div>
                <button id="saveToDbBtn" style="display:none;">保存到记录库</button>
            </div>
        </div>
<script>
let finalSeven = null;
const calcBtn = document.querySelector('#calcBtn');
const showResult = document.querySelector('#showResult');
const saveToDbBtn = document.querySelector('#saveToDbBtn');

calcBtn.onclick = async function(){
    saveToDbBtn.style.display = 'none';
    showResult.innerText = "正在生成号码...";

    // 前端本地生成6个不重复红球(1~33)
    const redNums = [];
    while(redNums.length < 6){
        const num = Math.floor(Math.random() * 33) + 1;
        if(!redNums.includes(num)){
            redNums.push(num);
        }
    }
    redNums.sort((a,b)=>a-b);
    // 蓝球 1~16
    const blueNum = Math.floor(Math.random() *16)+1;
    finalSeven = [...redNums, blueNum];

    showResult.innerText = `生成结果（红球排序+蓝球）：${finalSeven.join(" ")}`;
    saveToDbBtn.style.display = "inline-block";
}
saveToDbBtn.onclick = async function(){
    if(!finalSeven) return;
    document.getElementById('title').value = "量子随机号码";
    document.getElementById('content').value = `7位序列：${finalSeven.join(",")}`;
    saveData();
}
</script>
        <!-- =========模块结束========= -->
        <div id="list" style="margin-top:15px;"></div>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAhksWXChQieWR4Ogs6FR2PuTP3yyjyPdw",
    authDomain: "fir-001-f26d9.firebaseapp.com",
    projectId: "fir-001-f26d9",
    storageBucket: "fir-001-f26d9.appspot.com",
    messagingSenderId: "944028774180",
    appId: "1:944028774180:web:3bf07903a20c52b66927db"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const USER_ID = "1816561717";
const USER_PWD = "xxx2351554";

function login(){
    const uid = document.getElementById('uid').value.trim();
    const pwd = document.getElementById('pwd').value.trim();
    if(uid === USER_ID && pwd === USER_PWD){
        localStorage.setItem("isLogin","1");
        document.getElementById("loginPage").classList.add("hide");
        document.getElementById("mainPage").classList.remove("hide");
    }else{
        alert("账号或密码错误");
    }
}
function logout(){
    localStorage.removeItem("isLogin");
    location.reload();
}
window.onload = function(){
    if(localStorage.getItem("isLogin") === "1"){
        document.getElementById("loginPage").classList.add("hide");
        document.getElementById("mainPage").classList.remove("hide");
    }
}
async function saveData(){
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    if(!title || !content){
        alert("标题和内容不能为空");
        return;
    }
    await db.collection("records").add({
        title:title,
        content:content,
        time:new Date()
    });
    alert("保存成功");
    document.getElementById('title').value="";
    document.getElementById('content').value="";
}
async function search(){
    const kw = document.getElementById('kw').value.trim();
    const ref = db.collection("records").where("title",">=",kw).where("title","<",kw+"\uf8ff");
    const snapshot = await ref.get();
    renderList(snapshot);
}
async function getAll(){
    const snapshot = await db.collection("records").orderBy("time","desc").get();
    renderList(snapshot);
}
function renderList(snapshot){
    let html = "";
    snapshot.forEach(doc=>{
        const d = doc.data();
        html += `<div class="item"><h4>${d.title}</h4><p>${d.content}</p></div>`;
    })
    document.getElementById("list").innerHTML = html;
}
</script>
</body>
</html>
